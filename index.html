function tw(t){var w=0;for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);w+=c>255?10:(c===32?3:6)}return w}

function pinHtml(nos,unk){return '<span class="pill">'+nos.join('·')+'</span>'}
function zoneSvg(g,uid){
  var keys=[],by={};
  g.forEach(function(it){if(!by[it.l]){by[it.l]={nos:[],t:it.t};keys.push(it.l)}if(it._no)by[it.l].nos.push(it._no)});
  var zv=ZV[LOC[g[0].l].z],W=zv.W,H=zv.H,sc=zv.sc,pos={};

  var ed='',lb='';
  for(var i=0;i<g.length-1;i++){var a=g[i],b=g[i+1];if(a.l===b.l)continue;
    var A=pos[a.l],B=pos[b.l],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,off=Math.min(28,len*.18);
    var p0={x:A.x+ux*15,y:A.y+uy*15},p2={x:B.x-ux*19,y:B.y-uy*19},c={x:(A.x+B.x)/2-uy*off,y:(A.y+B.y)/2+ux*off};
    ed+='<path class="edgeh" d="M'+R(p0.x)+' '+R(p0.y)+'Q'+R(c.x)+' '+R(c.y)+' '+R(p2.x)+' '+R(p2.y)+'"/><path class="edge" marker-end="url(#ah'+uid+')" d="M'+R(p0.x)+' '+R(p0.y)+'Q'+R(c.x)+' '+R(c.y)+' '+R(p2.x)+' '+R(p2.y)+'"/>';
    if(a.ar){var al=a.ar.replace(/ ?\(.*\)/,'').replace('약 ',''),m={x:(p0.x+2*c.x+p2.x)/4,y:(p0.y+2*c.y+p2.y)/4},w=tw(al)+12;

  o+=ed+lb;

     +'<text class="ptxt" text-anchor="'+an+'" x="'+R(tx)+'" y="'+R(P.y-2)+'">'+esc(L.n)+'</text><text class="ptime" text-anchor="'+an+'" x="'+R(tx)+'" y="'+R(P.y+11)+'">'+by[k].t+'</text>'});
  var nice=[50,100,200,500,1000,2000,5000],m=50;nice.forEach(function(v){if(v*sc<=80)m=v});

function R(v){return Math.round(v*10)/10}
function mapView(n){
  var d=D[n];nolist(d);
  var nodes=d.i.filter(function(it){return it.l}),groups=[];
  nodes.forEach(function(it){var z=LOC[it.l].z,g=groups[groups.length-1];if(g&&g.z===z)g.n.push(it);else groups.push({z:z,n:[it]})});

  h+='</ul><p class="mapnote">핀 위치는 OpenStreetMap 도로·해안선으로 그린 지도입니다. 모과호텔 위치와 카페는 대략 위치이니, 정확한 길은 네이버지도 링크로 확인하세요.</p>';
  return h}
function show(n){
